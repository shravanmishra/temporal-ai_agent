<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporal M1 Mac Assistant</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f5f7;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 16px;
            box-sizing: border-box;
        }
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }
        .chat-container {
            width: min(480px, 100%);
            height: min(720px, calc(100dvh - 32px));
            min-height: min(560px, calc(100dvh - 32px));
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: #1d1d1f;
            color: white;
            padding: 16px;
            font-weight: 600;
            text-align: center;
        }
        .chat-messages {
            flex: 1;
            padding: 16px;
            min-height: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
        .user-message {
            background-color: #0071e3;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .assistant-message {
            background-color: #e8e8ed;
            color: #1d1d1f;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .chat-input-area {
            border-top: 1px solid #d2d2d7;
            padding: 12px max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
            display: flex;
            gap: 8px;
            background: #f5f5f7;
        }
        input {
            flex: 1;
            min-width: 0;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }
        button {
            background: #0071e3;
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            min-height: 42px;
            white-space: nowrap;
        }
        button:hover { background: #0077ed; }
        button:disabled,
        input:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        @media (max-width: 600px) {
            body {
                align-items: stretch;
                padding: 0;
            }

            .chat-container {
                width: 100%;
                height: 100vh;
                height: 100dvh;
                min-height: 0;
                border-radius: 0;
                box-shadow: none;
            }

            .chat-header {
                padding-top: max(14px, env(safe-area-inset-top));
            }

            .chat-messages {
                padding: 12px;
            }

            .message {
                max-width: 88%;
                font-size: 15px;
            }

            .chat-input-area {
                padding-top: 10px;
            }

            input,
            button {
                font-size: 16px;
            }
        }

        @media (max-height: 600px) and (orientation: landscape) {
            body {
                padding: 0;
            }

            .chat-container {
                width: min(720px, calc(100% - 24px));
                height: 100dvh;
                min-height: 0;
                border-radius: 0;
                box-shadow: none;
            }

            .chat-header {
                padding: 8px 12px;
            }

            .chat-messages {
                padding: 8px 12px;
                gap: 8px;
            }

            .message {
                padding: 8px 12px;
            }

            .chat-input-area {
                padding: 8px 12px;
            }
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">🤖 Temporal Mac Assistant</div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Ask for 'mac stats' or type a message..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    const SESSION_STORAGE_KEY = 'temporal-agent-session-id-v2';
    function createSessionId() {
        if (crypto.randomUUID) return crypto.randomUUID();
        if (crypto.getRandomValues) {
            const bytes = new Uint8Array(16);
            crypto.getRandomValues(bytes);
            bytes[6] = (bytes[6] & 0x0f) | 0x40;
            bytes[8] = (bytes[8] & 0x3f) | 0x80;
            return [...bytes].map((byte, index) => {
                const value = byte.toString(16).padStart(2, '0');
                return [4, 6, 8, 10].includes(index) ? `-${value}` : value;
            }).join('');
        }
        return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    let sessionId = localStorage.getItem(SESSION_STORAGE_KEY) || `web_ui_${createSessionId()}`;
    localStorage.setItem(SESSION_STORAGE_KEY, sessionId);
    let requestInFlight = false;

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
        if (requestInFlight) return;
        const inputEl = document.getElementById('userInput');
        const text = inputEl.value.trim();
        if (!text) return;

        requestInFlight = true;
        inputEl.disabled = true;
        document.querySelector('button').disabled = true;
        inputEl.value = '';
        appendMessage(text, 'user-message');

        const assistantBubble = appendMessage('', 'assistant-message');

        try {
            const apiBaseUrl = `http://${window.location.hostname}:8000`;
            const response = await fetch(`${apiBaseUrl}/api/chat/stream`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: sessionId, prompt: text })
            });

            if (!response.ok) {
                const detail = await response.text();
                throw new Error(detail || `Backend returned HTTP ${response.status}`);
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let eventType = 'message';

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                // Robustly segment incoming server lines by double line breaks
                const lines = buffer.split('\n');
                buffer = lines.pop() || '';

                for (const line of lines) {
                    const cleanLine = line.trim();
                    if (cleanLine.startsWith('event: ')) {
                        eventType = cleanLine.substring(7);
                        continue;
                    }
                    if (cleanLine.startsWith('data: ')) {
                        const token = line.substring(6); // Preserve white spacing fragments
                        if (token.trim() === '[DONE]') return;

                        if (eventType === 'error') {
                            assistantBubble.textContent = `[Workflow error: ${token}]`;
                            sessionId = `web_ui_${createSessionId()}`;
                            localStorage.setItem(SESSION_STORAGE_KEY, sessionId);
                            eventType = 'message';
                            continue;
                        }

                        // Append directly to screen layout
                        assistantBubble.textContent += token;
                        const msgBox = document.getElementById('chatMessages');
                        msgBox.scrollTop = msgBox.scrollHeight;
                    }
                }
            }

            // Handle a final SSE line that arrived without a trailing newline.
            const finalLine = buffer.trim();
            if (finalLine.startsWith('data: ') && finalLine.substring(6).trim() !== '[DONE]') {
                assistantBubble.textContent += finalLine.substring(6);
            }
        } catch (err) {
            assistantBubble.textContent = `[Error rendering response stream: ${err.message}]`;
        } finally {
            requestInFlight = false;
            inputEl.disabled = false;
            document.querySelector('button').disabled = false;
            inputEl.focus();
        }
    }

    function appendMessage(text, className) {
        const container = document.getElementById('chatMessages');
        const bubble = document.createElement('div');
        bubble.className = `message ${className}`;
        bubble.textContent = text;
        container.appendChild(bubble);
        container.scrollTop = container.scrollHeight;
        return bubble;
    }
</script>

</body>
</html>
