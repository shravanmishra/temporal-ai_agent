<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporal M1 Mac Assistant</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f5f7;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 480px;
            height: 600px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: #1d1d1f;
            color: white;
            padding: 16px;
            font-weight: 600;
            text-align: center;
        }
        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
            white-space: pre-wrap;
        }
        .user-message {
            background-color: #0071e3;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .assistant-message {
            background-color: #e8e8ed;
            color: #1d1d1f;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .chat-input-area {
            border-top: 1px solid #d2d2d7;
            padding: 12px;
            display: flex;
            gap: 8px;
            background: #f5f5f7;
        }
        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }
        button {
            background: #0071e3;
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
        }
        button:hover { background: #0077ed; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">🤖 Temporal Mac Assistant</div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Ask for 'mac stats' or type a message..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    const SESSION_ID = "web_ui_session_002"; // Bumped version layout to keep state clear

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
        const inputEl = document.getElementById('userInput');
        const text = inputEl.value.trim();
        if (!text) return;

        inputEl.value = '';
        appendMessage(text, 'user-message');

        const assistantBubble = appendMessage('', 'assistant-message');

        try {
            const response = await fetch('http://localhost:8000/api/chat/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: SESSION_ID, prompt: text })
            });

            if (!response.ok) throw new Error("Failed connecting to backend server API");

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                // Robustly segment incoming server lines by double line breaks
                const lines = buffer.split('\n');

                // Keep the last incomplete block back inside our tracking buffer loop
                buffer = lines.pop();

                for (const line of lines) {
                    const cleanLine = line.trim();
                    if (cleanLine.startsWith('data: ')) {
                        const token = line.substring(6); // Preserve white spacing fragments
                        if (token.trim() === '[DONE]') break;

                        // Append directly to screen layout
                        assistantBubble.textContent += token;
                        const msgBox = document.getElementById('chatMessages');
                        msgBox.scrollTop = msgBox.scrollHeight;
                    }
                }
            }
        } catch (err) {
            assistantBubble.textContent = `[Error rendering response stream: ${err.message}]`;
        }
    }

    function appendMessage(text, className) {
        const container = document.getElementById('chatMessages');
        const bubble = document.createElement('div');
        bubble.className = `message ${className}`;
        bubble.textContent = text;
        container.appendChild(bubble);
        container.scrollTop = container.scrollHeight;
        return bubble;
    }
</script>

</body>
</html>
